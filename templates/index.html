<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keepit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <nav>
      <a class="logo" href="/">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="22" fill="#5A3002"/>
          <line x1="28" y1="22" x2="28" y2="78" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="72" y1="50" x2="33" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="33" y1="50" x2="52" y2="28" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="33" y1="50" x2="52" y2="72" stroke="white" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Keepit</span>
      </a>
      <div class="nav-btns">
        <button id="btn-archives">아카이브</button>
        <button id="btn-reminders">리마인더</button>
        <button id="btn-report">월간 레포트</button>
        <button id="btn-weekly-report">주간 레포트</button>
        <button id="btn-reclassify" title="저장된 콘텐츠 카테고리 재정리">재분류</button>
        <div class="nav-user-card" id="nav-user-card">
          <div class="nav-avatar" id="nav-avatar"></div>
          <span class="nav-username" id="nav-username"></span>
          <button class="nav-logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
      </div>
    </nav>

    <div class="page-wrapper">
      <!-- 좌측 컬렉션(폴더) 사이드바 -->
      <aside class="left-sidebar" id="left-sidebar">
        <div id="group-list" class="group-list"></div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <main class="main-content">
        <div class="stage" id="stage">
          <!-- 메인 컬럼: 찐한 갈색 패널 + 통계 바 -->
          <div class="main-col">
            <div class="hero-panel">
              <h1 class="keepit">KEEP IT!</h1>
              <!-- 상단: 좌(이번주 취향유형) · 우(캐릭터) -->
              <section class="hero-row">
                <!-- 좌: 이번 주 취향 유형 -->
                <div id="persona-card" class="persona-box" style="display:none"></div>
                <!-- 우: 캐릭터 + 소품 -->
                <div class="char-zone">
                  <div class="mascot-area">
                    <div class="speech-bubble" id="speech-bubble">
                      <span id="speech-text"></span>
                      <div id="speech-cards" class="speech-cards"></div>
                    </div>
                    <img id="mascot" class="mascot" src="/static/images/keepi/keepi_default.png" alt="키피" />
                  </div>
                  <div class="char-props" aria-hidden="true"><span>🌰</span><span>📚</span><span>🍂</span></div>
                </div>
              </section>
            </div>

            <!-- 5개 통계 바 -->
            <div class="stat-bars" id="stat-bars">
              <div class="stat-bar"><span class="sb-icon">🔗</span><span class="sb-label">저장한 링크</span><span class="sb-value" id="sb-links">–</span></div>
              <div class="stat-bar"><span class="sb-icon">📁</span><span class="sb-label">생성된 컬렉션</span><span class="sb-value" id="sb-collections">–</span></div>
              <div class="stat-bar"><span class="sb-icon">🔥</span><span class="sb-label">연속 저장중!</span><span class="sb-value" id="sb-streak">–</span></div>
              <div class="stat-bar"><span class="sb-icon">⏱️</span><span class="sb-label">예상 소비시간</span><span class="sb-value" id="sb-time">–</span></div>
              <button class="stat-bar stat-reminder" id="bar-reminder" type="button"><span class="sb-icon">🔔</span><span class="sb-label">리마인더</span><span class="sb-value" id="sb-reminder">–</span></button>
            </div>
          </div>

          <!-- 채팅 영역 (기본: 채팅바 / 대화: 큰 박스로 확장) -->
          <section class="chat-zone" id="chat-zone">
            <div class="chat-box-head">
              <span class="chat-box-title">키피와의 대화</span>
              <button class="chat-collapse-btn" id="chat-collapse" type="button" aria-label="채팅 접기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <div class="chat-box-inner">
              <div class="chat-messages" id="chat-messages"></div>
            </div>
            <p class="hint chat-hint">마감기한 추가 예시: https://example.com 마감: 2026-06-01</p>
            <div class="chat-input-wrap chat-bar">
              <input type="text" id="chat-input" class="chat-input" placeholder="무엇이든 물어보세요" autocomplete="off" />
              <button id="chat-send" class="chat-send-btn">&#8594;</button>
            </div>
            <button class="chat-expand-btn" id="chat-expand" type="button" aria-label="채팅 펼치기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              <span class="ceb-text">채팅</span>
            </button>
          </section>
        </div>

        <section id="results" class="results-section" hidden></section>
      </main>

      <!-- 우측 슬라이드 패널 (카테고리 상세 / AI 채팅) -->
      <div class="right-panel" id="right-panel">
        <div class="right-panel-inner">
          <div class="panel-header">
            <span id="panel-title" class="panel-title"></span>
            <button id="panel-close" class="panel-close-btn">접기 ›</button>
          </div>
          <div id="panel-body" class="panel-body"></div>
        </div>
      </div>
    </div>

    <!-- 아카이브·리마인더·레포트 모달 -->
    <div id="modal" class="modal">
      <div class="modal-panel">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="login-overlay">
      <div class="login-box">
        <div class="login-logo">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:48px;height:48px">
            <rect width="100" height="100" rx="22" fill="#5A3002"/>
            <line x1="28" y1="22" x2="28" y2="78" stroke="white" stroke-width="5" stroke-linecap="round"/>
            <line x1="72" y1="50" x2="33" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
            <line x1="33" y1="50" x2="52" y2="28" stroke="white" stroke-width="5" stroke-linecap="round"/>
            <line x1="33" y1="50" x2="52" y2="72" stroke="white" stroke-width="5" stroke-linecap="round"/>
          </svg>
          <span style="font-size:26px;font-weight:700;color:#5A3002;letter-spacing:-0.5px">Keepit</span>
        </div>

        <p class="login-desc">로그인하여 나만의 아카이브를 만들어보세요</p>

        <div class="oauth-btns">
          <a href="/auth/kakao" class="oauth-btn kakao-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#3A1D1D" d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.617 5.078 4.072 6.517L5.1 21l4.682-2.492A11.3 11.3 0 0 0 12 18.6c5.523 0 10-3.477 10-7.8S17.523 3 12 3z"/></svg>
            카카오로 계속하기
          </a>
        </div>
      </div>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
