<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keepit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}" />
  </head>
  <body>
    <nav>
      <a class="logo" href="/">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="22" fill="#5A3002"/>
          <line x1="28" y1="22" x2="28" y2="78" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="72" y1="50" x2="33" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="33" y1="50" x2="52" y2="28" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="33" y1="50" x2="52" y2="72" stroke="white" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Keepit</span>
      </a>
      <div class="nav-btns">
        <button id="btn-archives">아카이브</button>
        <button id="btn-reminders">리마인더</button>
        <button id="btn-report">월간 레포트</button>
        <button id="btn-weekly-report">주간 레포트</button>

        <div class="nav-divider" aria-hidden="true"></div>

        {% if user %}
          <div class="nav-user">
            {% if user.avatar %}
              <img class="nav-avatar" src="{{ user.avatar }}" alt="{{ user.name or user.email }}" referrerpolicy="no-referrer" />
            {% else %}
              <div class="nav-avatar nav-avatar-fallback">{{ (user.name or user.email or '?')[0] | upper }}</div>
            {% endif %}
            <span class="nav-username">{{ user.name or user.email }}</span>
          </div>
        {% endif %}

        <button class="logout-btn" onclick="window.keepitLogout?.()">로그아웃</button>
      </div>
    </nav>

    <div class="page-wrapper">
      <!-- 좌측 컬렉션(폴더) 사이드바 -->
      <aside class="left-sidebar" id="left-sidebar">
        <button class="sidebar-tab" id="sidebar-tab" onclick="toggleSidebar()" title="내 컬렉션 열기">내 컬렉션</button>
        <div class="sidebar-full">
          <div class="sidebar-header">
            <span class="sidebar-header-title">내 컬렉션</span>
            <button class="sidebar-collapse-btn" onclick="toggleSidebar()" title="사이드바 접기" aria-label="사이드바 접기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13 17 8 12 13 7"/>
              </svg>
            </button>
          </div>
          <div id="group-list" class="group-list"></div>
        </div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <main class="main-content">
        <div class="stage" id="stage">
          <!-- 메인 컬럼: 찐한 갈색 패널 + 통계 바 -->
          <div class="main-col">
          <div class="hero-panel">
          <h1 class="keepit">KEEP IT!</h1>
          <!-- 상단: 좌(이번주 취향유형) · 우(캐릭터 + 소품) -->
          <section class="hero-row">
            <!-- 좌: 이번 주 취향 유형 -->
            <div id="persona-card" class="persona-box" style="display:none"></div>
            <!-- 우: 캐릭터 + 소품 -->
            <div class="char-zone">
            <!-- 키피 마스코트 (위에 말풍선) -->
            <div class="mascot-area">
            <div class="speech-bubble" id="speech-bubble">
              <span id="speech-text"></span>
              <div id="speech-cards" class="speech-cards"></div>
            </div>
            <div class="mascot" id="mascot" title="키피" aria-label="키피 마스코트">
              <svg viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="kpBody" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#D89A66"/>
                    <stop offset="1" stop-color="#A4682F"/>
                  </linearGradient>
                  <linearGradient id="kpCap" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#7A4A1C"/>
                    <stop offset="1" stop-color="#5A3002"/>
                  </linearGradient>
                </defs>

                <!-- 그림자 -->
                <ellipse class="mascot-shadow" cx="110" cy="228" rx="58" ry="11" fill="rgba(90,48,2,0.14)"/>

                <!-- 줄기 -->
                <path class="mascot-sprout" d="M110 40 Q106 18 122 10" stroke="#5A3002" stroke-width="7" stroke-linecap="round" fill="none"/>

                <!-- 팔 -->
                <path class="arm arm-left" d="M52 150 Q34 158 37 176" stroke="#A4682F" stroke-width="11" stroke-linecap="round" fill="none"/>
                <path class="arm arm-right" d="M168 150 Q186 158 183 176" stroke="#A4682F" stroke-width="11" stroke-linecap="round" fill="none"/>

                <!-- 몸통(견과) -->
                <path d="M48 122 Q48 212 110 216 Q172 212 172 122 Z" fill="url(#kpBody)"/>

                <!-- 모자(깍지) -->
                <path d="M44 120 Q44 62 110 56 Q176 62 176 120 Q176 128 168 128 L52 128 Q44 128 44 120 Z" fill="url(#kpCap)"/>
                <circle cx="74" cy="98" r="4" fill="rgba(255,255,255,0.12)"/>
                <circle cx="110" cy="86" r="4" fill="rgba(255,255,255,0.12)"/>
                <circle cx="146" cy="98" r="4" fill="rgba(255,255,255,0.12)"/>

                <!-- 볼 -->
                <circle class="cheek" cx="74" cy="170" r="11" fill="#E8896A" opacity="0.55"/>
                <circle class="cheek" cx="146" cy="170" r="11" fill="#E8896A" opacity="0.55"/>

                <!-- 눈 -->
                <g class="eye eye-left">
                  <ellipse cx="90" cy="152" rx="8" ry="11" fill="#3A2410"/>
                  <circle cx="93" cy="148" r="3" fill="#fff"/>
                </g>
                <g class="eye eye-right">
                  <ellipse cx="130" cy="152" rx="8" ry="11" fill="#3A2410"/>
                  <circle cx="133" cy="148" r="3" fill="#fff"/>
                </g>

                <!-- 입 -->
                <path class="mouth" d="M101 170 Q110 180 119 170" stroke="#3A2410" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
            </div>
            <!-- 캐릭터 밑 소품 (조그맣게) -->
            <div class="char-props" aria-hidden="true"><span>🌰</span><span>📚</span><span>🍂</span></div>
            </div>
          </section>
          </div><!-- /hero-panel -->

          <!-- 5개 통계 바 (찐갈↔연갈 경계선에 걸침) -->
          <div class="stat-bars" id="stat-bars">
            <div class="stat-bar"><span class="sb-icon">🔗</span><span class="sb-label">저장한 링크</span><span class="sb-value" id="sb-links">–</span></div>
            <div class="stat-bar"><span class="sb-icon">📁</span><span class="sb-label">생성된 컬렉션</span><span class="sb-value" id="sb-collections">–</span></div>
            <div class="stat-bar"><span class="sb-icon">🔥</span><span class="sb-label">연속 저장중!</span><span class="sb-value" id="sb-streak">–</span></div>
            <div class="stat-bar"><span class="sb-icon">⏱️</span><span class="sb-label">예상 소비시간</span><span class="sb-value" id="sb-time">–</span></div>
            <button class="stat-bar stat-reminder" id="bar-reminder" type="button"><span class="sb-icon">🔔</span><span class="sb-label">리마인더</span><span class="sb-value" id="sb-reminder">–</span></button>
          </div>
          </div><!-- /main-col -->

          <!-- 채팅 영역 (기본: 채팅바 / 대화: 큰 박스로 확장 · 접기 가능) -->
          <section class="chat-zone" id="chat-zone">
            <!-- 대화 펼침 시 헤더(접기 버튼) -->
            <div class="chat-box-head">
              <span class="chat-box-title">키피와의 대화</span>
              <button class="chat-collapse-btn" id="chat-collapse" type="button" aria-label="채팅 접기" title="접기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>

            <div class="chat-box-inner">
              <div class="chat-messages" id="chat-messages"></div>
            </div>
            <p class="hint chat-hint">마감기한 추가 예시: https://example.com 마감: 2026-06-01</p>
            <div class="chat-input-wrap chat-bar">
              <input type="text" id="chat-input" class="chat-input" placeholder="무엇이든 물어보세요" autocomplete="off" />
              <button id="chat-send" class="chat-send-btn">&#8594;</button>
            </div>

            <!-- 접힘 시 세로 펼치기 버튼 -->
            <button class="chat-expand-btn" id="chat-expand" type="button" aria-label="채팅 펼치기" title="펼치기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              <span class="ceb-text">채팅</span>
            </button>
          </section>
        </div>

        <!-- 저장 결과(미사용 대비 유지) -->
        <section id="results" class="results-section" hidden></section>
      </main>

      <!-- 우측 슬라이드 패널 (카테고리 상세 / AI 채팅) -->
      <div class="right-panel" id="right-panel">
        <div class="right-panel-inner">
          <div class="panel-header">
            <span id="panel-title" class="panel-title"></span>
            <button id="panel-close" class="panel-close-btn" title="패널 닫기" aria-label="패널 닫기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <line x1="15" y1="4" x2="15" y2="20"/>
              </svg>
            </button>
          </div>
          <div id="panel-body" class="panel-body"></div>
        </div>
      </div>
    </div>

    <!-- 우측 상세 패널 (컬렉션 / 카테고리) — 채팅과 분리 -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <span class="detail-title" id="detail-title"></span>
        <div class="detail-header-actions" id="detail-header-actions"></div>
        <button class="detail-close" onclick="closeDetailPanel()" title="닫기" aria-label="닫기">&times;</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>

    <!-- 채팅 다시 열기 (접힌 동안 우상단 노출) -->
    <button id="panel-reopen" class="panel-reopen-btn" style="display:none" aria-label="채팅 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="reopen-tip">채팅 열기</span>
    </button>

    <!-- 아카이브·리마인더·레포트 모달 -->
    <div id="modal" class="modal">
      <div class="modal-panel">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- 로그인 사용자 id 주입 (main.js보다 먼저 실행) -->
    <script>
      window.__USER_ID__ = {{ (user.id if user else None) | tojson }};
    </script>
    <script src="/static/js/main.js?v={{ asset_v }}"></script>

    <!-- Supabase 세션 연동 스크립트 -->
    <script>
      window.__SUPABASE_URL__      = {{ supabase_url | tojson }};
      window.__SUPABASE_ANON_KEY__ = {{ supabase_anon_key | tojson }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script defer>
      window.addEventListener('load', function () {
        if (!window.supabase || !window.__SUPABASE_URL__) return;

        const _sb = window.supabase.createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__);

        async function initAuth() {
          const { data: { session } } = await _sb.auth.getSession();
          if (!session) {
            // Supabase 세션 없음 → 서버 세션도 정리 후 로그인으로 (루프 방지)
            await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
            window.location.href = '/login';
            return;
          }
          // 서버 JWT 세션 동기화
          await fetch('/api/auth/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: session.user, access_token: session.access_token }),
          }).catch(() => {});
        }

        _sb.auth.onAuthStateChange(function (event) {
          if (event === 'SIGNED_OUT') window.location.href = '/login';
        });

        initAuth();

        window.keepitLogout = async function () {
          await _sb.auth.signOut();
          await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
          window.location.href = '/login';
        };
      });
    </script>
  </body>
</html>
